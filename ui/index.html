<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ownly - AI Home Buyer Advisor</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.9/babel.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.1/marked.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #060a10;
      --surface: #0d1117;
      --surface-alt: #151b26;
      --surface-hover: #1a2233;
      --border: #21293a;
      --border-light: #2d3a50;
      --accent: #4f9cf7;
      --accent-dim: #1a3a6a;
      --accent-glow: rgba(79, 156, 247, 0.12);
      --teal: #0ea5a0;
      --teal-dim: #0a3d3d;
      --amber: #e5a93d;
      --rose: #e5475b;
      --text: #dfe6f0;
      --text-dim: #7a8ba3;
      --text-faint: #4a5568;
      --radius: 10px;
      --font-body: 'DM Sans', -apple-system, sans-serif;
      --font-display: 'Fraunces', Georgia, serif;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--font-body);
      height: 100vh;
      overflow: hidden;
    }

    .app {
      display: flex;
      height: 100vh;
    }

    /* ── Sidebar ── */
    .sidebar {
      width: 280px;
      min-width: 280px;
      background: var(--surface);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      transition: margin-left 0.25s ease, opacity 0.25s ease;
    }
    .sidebar.collapsed {
      margin-left: -280px;
      opacity: 0;
      pointer-events: none;
    }
    .sidebar-header {
      padding: 20px;
      border-bottom: 1px solid var(--border);
    }
    .sidebar-logo {
      font-family: var(--font-display);
      font-size: 22px;
      font-weight: 700;
      color: var(--accent);
      letter-spacing: -0.5px;
    }
    .sidebar-tagline {
      font-size: 11px;
      color: var(--text-dim);
      margin-top: 4px;
      letter-spacing: 0.3px;
    }
    .new-chat-sidebar {
      margin: 16px 20px;
      padding: 10px;
      background: var(--accent-dim);
      border: 1px solid var(--accent);
      border-radius: var(--radius);
      color: var(--accent);
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      font-family: var(--font-body);
      text-align: center;
      transition: background 0.15s;
    }
    .new-chat-sidebar:hover { background: rgba(79, 156, 247, 0.2); }

    .sidebar-section-title {
      padding: 16px 20px 8px;
      font-size: 10px;
      font-weight: 600;
      color: var(--text-faint);
      letter-spacing: 1.2px;
      text-transform: uppercase;
    }
    .topic-list {
      flex: 1;
      overflow-y: auto;
      padding: 0 12px 20px;
    }
    .topic-item {
      padding: 9px 12px;
      border-radius: 6px;
      font-size: 13px;
      color: var(--text-dim);
      cursor: pointer;
      transition: all 0.12s;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .topic-item:hover {
      background: var(--surface-hover);
      color: var(--text);
    }
    .topic-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    .progress-bar-wrap {
      padding: 16px 20px;
      border-top: 1px solid var(--border);
    }
    .progress-label {
      font-size: 11px;
      color: var(--text-dim);
      margin-bottom: 6px;
      display: flex;
      justify-content: space-between;
    }
    .progress-track {
      height: 4px;
      background: var(--surface-alt);
      border-radius: 2px;
      overflow: hidden;
    }
    .progress-fill {
      height: 100%;
      background: var(--teal);
      border-radius: 2px;
      transition: width 0.4s ease;
    }

    /* ── Main Area ── */
    .main {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-width: 0;
    }

    .topbar {
      height: 52px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      padding: 0 16px;
      gap: 12px;
      background: var(--surface);
    }
    .menu-btn {
      background: none;
      border: none;
      color: var(--text-dim);
      cursor: pointer;
      padding: 6px;
      border-radius: 6px;
      display: flex;
      align-items: center;
    }
    .menu-btn:hover { background: var(--surface-hover); color: var(--text); }
    .topbar-title {
      font-size: 14px;
      font-weight: 600;
      color: var(--text);
      flex: 1;
    }
    .topbar-status {
      font-size: 11px;
      color: var(--teal);
      display: flex;
      align-items: center;
      gap: 5px;
    }
    .status-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--teal);
    }

    /* ── Messages ── */
    .messages-wrap {
      flex: 1;
      overflow-y: auto;
      padding: 24px 0;
    }
    .messages-inner {
      max-width: 760px;
      margin: 0 auto;
      padding: 0 20px;
    }

    /* ── Welcome ── */
    .welcome {
      text-align: center;
      padding: 60px 20px 40px;
      animation: fadeUp 0.5s ease;
    }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(16px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .welcome h1 {
      font-family: var(--font-display);
      font-size: 32px;
      font-weight: 700;
      color: var(--text);
      margin-bottom: 8px;
    }
    .welcome h1 span { color: var(--accent); }
    .welcome p {
      color: var(--text-dim);
      font-size: 15px;
      max-width: 460px;
      margin: 0 auto 32px;
      line-height: 1.6;
    }
    .quick-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      max-width: 520px;
      margin: 0 auto;
    }
    .quick-btn {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 14px 16px;
      color: var(--text-dim);
      font-size: 13px;
      font-family: var(--font-body);
      cursor: pointer;
      text-align: left;
      line-height: 1.4;
      transition: all 0.15s;
    }
    .quick-btn:hover {
      background: var(--surface-hover);
      border-color: var(--border-light);
      color: var(--text);
    }

    /* ── Message Rows ── */
    .msg-row {
      display: flex;
      gap: 12px;
      margin-bottom: 24px;
      animation: fadeUp 0.3s ease;
    }
    .msg-row.user { flex-direction: row-reverse; }

    .msg-avatar {
      width: 32px;
      height: 32px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 11px;
      font-weight: 700;
      flex-shrink: 0;
      margin-top: 2px;
    }
    .msg-avatar.ai { background: var(--accent-dim); color: var(--accent); }
    .msg-avatar.user { background: var(--teal-dim); color: var(--teal); }

    .msg-body { max-width: 85%; min-width: 0; }

    .msg-bubble {
      padding: 12px 16px;
      border-radius: var(--radius);
      font-size: 14px;
      line-height: 1.65;
      word-wrap: break-word;
      overflow-wrap: break-word;
    }
    .msg-bubble.ai {
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text);
    }
    .msg-bubble.user {
      background: var(--accent-dim);
      border: 1px solid rgba(79, 156, 247, 0.25);
      color: var(--text);
    }
    .msg-bubble p { margin-bottom: 10px; }
    .msg-bubble p:last-child { margin-bottom: 0; }
    .msg-bubble strong { color: var(--accent); font-weight: 600; }
    .msg-bubble code {
      background: var(--bg);
      padding: 1px 5px;
      border-radius: 4px;
      font-size: 13px;
    }
    .msg-bubble ul, .msg-bubble ol {
      margin: 8px 0;
      padding-left: 20px;
    }
    .msg-bubble li { margin-bottom: 4px; }

    /* Markdown tables */
    .msg-bubble table {
      width: 100%;
      border-collapse: collapse;
      margin: 12px 0;
      font-size: 13px;
    }
    .msg-bubble th {
      background: var(--surface-alt);
      color: var(--accent);
      font-weight: 600;
      text-align: left;
      padding: 8px 10px;
      border: 1px solid var(--border);
    }
    .msg-bubble td {
      padding: 7px 10px;
      border: 1px solid var(--border);
      vertical-align: top;
    }
    .msg-bubble tr:nth-child(even) td {
      background: rgba(255,255,255,0.02);
    }

    /* Markdown headers */
    .msg-bubble h1, .msg-bubble h2, .msg-bubble h3,
    .msg-bubble h4, .msg-bubble h5, .msg-bubble h6 {
      color: var(--text);
      margin: 16px 0 8px;
      line-height: 1.3;
    }
    .msg-bubble h1 { font-size: 18px; }
    .msg-bubble h2 { font-size: 16px; }
    .msg-bubble h3 { font-size: 15px; color: var(--accent); }
    .msg-bubble h4 { font-size: 14px; color: var(--teal); }
    .msg-bubble h5, .msg-bubble h6 { font-size: 13px; color: var(--text-dim); }
    .msg-bubble h1:first-child, .msg-bubble h2:first-child,
    .msg-bubble h3:first-child, .msg-bubble h4:first-child { margin-top: 0; }

    /* Blockquotes */
    .msg-bubble blockquote {
      border-left: 3px solid var(--accent);
      margin: 10px 0;
      padding: 8px 14px;
      background: var(--surface-alt);
      border-radius: 0 6px 6px 0;
      color: var(--text-dim);
      font-size: 13px;
    }
    .msg-bubble blockquote p { margin-bottom: 4px; }
    .msg-bubble blockquote p:last-child { margin-bottom: 0; }

    /* Horizontal rules */
    .msg-bubble hr {
      border: none;
      border-top: 1px solid var(--border);
      margin: 14px 0;
    }

    /* Code blocks */
    .msg-bubble pre {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 12px;
      overflow-x: auto;
      margin: 10px 0;
      font-size: 13px;
    }
    .msg-bubble pre code {
      background: none;
      padding: 0;
    }

    .msg-time {
      font-size: 10px;
      color: var(--text-faint);
      margin-top: 4px;
      padding: 0 4px;
    }
    .msg-row.user .msg-time { text-align: right; }

    .msg-topics {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      margin-top: 8px;
    }
    .msg-topic-tag {
      font-size: 11px;
      padding: 3px 8px;
      border-radius: 4px;
      background: var(--surface-alt);
      color: var(--text-dim);
      border: 1px solid var(--border);
    }

    /* ── Typing indicator ── */
    .typing {
      display: flex;
      gap: 12px;
      margin-bottom: 24px;
    }
    .typing-dots {
      display: flex;
      gap: 4px;
      padding: 14px 18px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
    }
    .typing-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--text-dim);
      animation: blink 1.2s infinite;
    }
    .typing-dot:nth-child(2) { animation-delay: 0.2s; }
    .typing-dot:nth-child(3) { animation-delay: 0.4s; }
    @keyframes blink {
      0%, 60%, 100% { opacity: 0.25; }
      30% { opacity: 1; }
    }

    /* ── Input Area ── */
    .input-area {
      border-top: 1px solid var(--border);
      padding: 16px 20px;
      background: var(--surface);
    }
    .input-wrap {
      max-width: 760px;
      margin: 0 auto;
      display: flex;
      align-items: flex-end;
      gap: 10px;
      background: var(--surface-alt);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 6px 6px 6px 16px;
      transition: border-color 0.15s;
    }
    .input-wrap:focus-within { border-color: var(--accent); }

    .input-field {
      flex: 1;
      background: none;
      border: none;
      color: var(--text);
      font-size: 14px;
      font-family: var(--font-body);
      resize: none;
      outline: none;
      line-height: 1.5;
      max-height: 120px;
      padding: 6px 0;
    }
    .input-field::placeholder { color: var(--text-faint); }

    .send-btn {
      width: 36px;
      height: 36px;
      border-radius: 8px;
      border: none;
      background: var(--accent);
      color: #fff;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: opacity 0.15s;
    }
    .send-btn:disabled { opacity: 0.3; cursor: default; }
    .send-btn:not(:disabled):hover { opacity: 0.85; }
    .send-btn svg { width: 16px; height: 16px; }

    .input-hint {
      max-width: 760px;
      margin: 6px auto 0;
      font-size: 11px;
      color: var(--text-faint);
      text-align: center;
    }

    /* ── Onboarding modal ── */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.7);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 100;
      animation: fadeUp 0.25s ease;
    }
    .modal {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 32px;
      width: 420px;
      max-width: 90vw;
    }
    .modal h2 {
      font-family: var(--font-display);
      font-size: 20px;
      margin-bottom: 4px;
      color: var(--text);
    }
    .modal .sub {
      font-size: 13px;
      color: var(--text-dim);
      margin-bottom: 20px;
    }
    .field { margin-bottom: 14px; }
    .field label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      color: var(--text-dim);
      margin-bottom: 5px;
    }
    .field input, .field select {
      width: 100%;
      padding: 9px 12px;
      background: var(--surface-alt);
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text);
      font-size: 14px;
      font-family: var(--font-body);
      outline: none;
    }
    .field input:focus, .field select:focus { border-color: var(--accent); }
    .field-row { display: flex; gap: 12px; }
    .field-row .field { flex: 1; }

    .modal-actions {
      display: flex;
      gap: 10px;
      margin-top: 20px;
    }
    .btn-primary {
      flex: 1;
      padding: 10px;
      background: var(--accent);
      border: none;
      border-radius: 8px;
      color: #fff;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      font-family: var(--font-body);
    }
    .btn-primary:hover { opacity: 0.9; }
    .btn-ghost {
      padding: 10px 16px;
      background: none;
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text-dim);
      font-size: 14px;
      cursor: pointer;
      font-family: var(--font-body);
    }
    .btn-ghost:hover { background: var(--surface-hover); }

    /* ── Responsive ── */
    @media (max-width: 768px) {
      .sidebar { position: fixed; z-index: 50; height: 100vh; }
      .sidebar.collapsed { margin-left: -280px; }
      .sidebar-backdrop {
        position: fixed;
        inset: 0;
        background: rgba(0,0,0,0.5);
        z-index: 49;
      }
      .quick-grid { grid-template-columns: 1fr; }
    }
    @media (min-width: 769px) {
      .sidebar-backdrop { display: none; }
    }
    .sidebar-close {
      position: absolute;
      top: 16px;
      right: 12px;
      background: none;
      border: none;
      color: var(--text-dim);
      cursor: pointer;
      padding: 4px;
      border-radius: 4px;
      display: none;
    }
    .sidebar-close:hover { color: var(--text); background: var(--surface-hover); }
    @media (max-width: 768px) {
      .sidebar-close { display: block; }
      .sidebar-header { position: relative; }
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef, useCallback } = React;

    // ── API ──
    const API_BASE = window.location.origin + "/api";

    async function apiPost(path, body) {
      const res = await fetch(API_BASE + path, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(body),
      });
      if (!res.ok) throw new Error(`API ${res.status}`);
      return res.json();
    }

    async function apiGet(path) {
      const res = await fetch(API_BASE + path);
      if (!res.ok) throw new Error(`API ${res.status}`);
      return res.json();
    }

    // ── Markdown rendering via marked.js ──
    marked.setOptions({
      breaks: true,
      gfm: true,
    });

    function formatText(text) {
      if (!text) return "";
      return marked.parse(text);
    }

    // ── Category colors ──
    const CAT_COLORS = {
      regulatory: "#4f9cf7",
      down_payment: "#0ea5a0",
      rates: "#e5a93d",
      affordability: "#a78bfa",
      costs: "#e5475b",
      pre_construction: "#f97316",
      products: "#6ee7b7",
      programs: "#f472b6",
      process: "#94a3b8",
    };

    // ── Quick start questions ──
    const QUICK_QUESTIONS = [
      "How does the mortgage stress test work?",
      "What's the minimum down payment for a $700K home?",
      "Should I go fixed or variable rate?",
      "What are the risks of buying pre-construction?",
      "What closing costs should I budget for?",
      "Can I use both FHSA and HBP for my down payment?",
    ];

    // ── SVG Icons ──
    function SendIcon() {
      return (
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
          <line x1="22" y1="2" x2="11" y2="13" />
          <polygon points="22 2 15 22 11 13 2 9 22 2" />
        </svg>
      );
    }
    function MenuIcon() {
      return (
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round">
          <line x1="3" y1="6" x2="21" y2="6" /><line x1="3" y1="12" x2="21" y2="12" /><line x1="3" y1="18" x2="21" y2="18" />
        </svg>
      );
    }

    // ── Onboarding Modal ──
    function OnboardingModal({ onComplete, onSkip }) {
      const [form, setForm] = useState({
        name: "", income: "", dp_amount: "", location: "GTA",
        province: "ON", is_first_time: true, purchase_type: "pre-construction", target_price: "",
      });
      const [submitting, setSubmitting] = useState(false);

      const handleSubmit = async () => {
        setSubmitting(true);
        try {
          const body = { ...form };
          if (body.income) body.income = parseFloat(body.income);
          if (body.dp_amount) body.dp_amount = parseFloat(body.dp_amount);
          if (body.target_price) body.target_price = parseFloat(body.target_price);
          const resp = await apiPost("/context", body);
          onComplete(resp.user_id, resp.affordability_estimate);
        } catch (e) {
          console.error("Onboarding error:", e);
          onSkip();
        }
        setSubmitting(false);
      };

      const set = (k) => (e) => setForm({ ...form, [k]: e.target.value });

      return (
        <div className="modal-overlay">
          <div className="modal">
            <h2>Tell us about yourself</h2>
            <p className="sub">Personalize your experience (optional -- you can skip this)</p>

            <div className="field">
              <label>Name</label>
              <input placeholder="e.g. Priya" value={form.name} onChange={set("name")} />
            </div>

            <div className="field-row">
              <div className="field">
                <label>Annual Income ($)</label>
                <input type="number" placeholder="95000" value={form.income} onChange={set("income")} />
              </div>
              <div className="field">
                <label>Down Payment ($)</label>
                <input type="number" placeholder="45000" value={form.dp_amount} onChange={set("dp_amount")} />
              </div>
            </div>

            <div className="field-row">
              <div className="field">
                <label>Target Price ($)</label>
                <input type="number" placeholder="700000" value={form.target_price} onChange={set("target_price")} />
              </div>
              <div className="field">
                <label>Location</label>
                <input placeholder="GTA" value={form.location} onChange={set("location")} />
              </div>
            </div>

            <div className="field-row">
              <div className="field">
                <label>Purchase Type</label>
                <select value={form.purchase_type} onChange={set("purchase_type")}>
                  <option value="pre-construction">Pre-construction</option>
                  <option value="resale">Resale</option>
                  <option value="refinance">Refinance</option>
                </select>
              </div>
              <div className="field">
                <label>First-time Buyer?</label>
                <select value={form.is_first_time} onChange={(e) => setForm({...form, is_first_time: e.target.value === "true"})}>
                  <option value="true">Yes</option>
                  <option value="false">No</option>
                </select>
              </div>
            </div>

            <div className="modal-actions">
              <button className="btn-ghost" onClick={onSkip}>Skip</button>
              <button className="btn-primary" onClick={handleSubmit} disabled={submitting}>
                {submitting ? "Saving..." : "Start Learning"}
              </button>
            </div>
          </div>
        </div>
      );
    }

    // ── App ──
    function App() {
      const [sidebarOpen, setSidebarOpen] = useState(window.innerWidth > 768);
      const [showOnboarding, setShowOnboarding] = useState(true);
      const [userId, setUserId] = useState(null);
      const [sessionId, setSessionId] = useState(null);
      const [messages, setMessages] = useState([]);
      const [topics, setTopics] = useState([]);
      const [progress, setProgress] = useState({ topics_covered: 0, topics_total: 0, completion_pct: 0 });
      const [input, setInput] = useState("");
      const [loading, setLoading] = useState(false);
      const [estimate, setEstimate] = useState(null);
      const endRef = useRef(null);
      const inputRef = useRef(null);

      // Fetch topics on mount
      useEffect(() => {
        apiGet("/topics").then((d) => setTopics(d.topics || [])).catch(() => {});
      }, []);

      // Auto-scroll
      useEffect(() => {
        endRef.current?.scrollIntoView({ behavior: "smooth" });
      }, [messages, loading]);

      // Onboarding handlers
      const handleOnboardingComplete = (uid, est) => {
        setUserId(uid);
        setEstimate(est);
        setShowOnboarding(false);
      };
      const handleOnboardingSkip = () => {
        setShowOnboarding(false);
      };

      // Send message
      const sendMessage = useCallback(async (text) => {
        const msg = text || input.trim();
        if (!msg || loading) return;
        setInput("");

        const userMsg = { role: "user", content: msg, time: new Date() };
        setMessages((prev) => [...prev, userMsg]);
        setLoading(true);

        try {
          const body = { message: msg };
          if (userId) body.user_id = userId;
          if (sessionId) body.session_id = sessionId;

          const resp = await apiPost("/chat", body);

          if (resp.user_id) setUserId(resp.user_id);
          if (resp.session_id) setSessionId(resp.session_id);
          if (resp.progress) setProgress(resp.progress);

          const aiMsg = {
            role: "assistant",
            content: resp.message,
            time: new Date(),
            topics: resp.relevant_topics || [],
          };
          setMessages((prev) => [...prev, aiMsg]);
        } catch (err) {
          const errMsg = {
            role: "assistant",
            content: "Something went wrong connecting to the server. Please try again.",
            time: new Date(),
            topics: [],
          };
          setMessages((prev) => [...prev, errMsg]);
        }

        setLoading(false);
        inputRef.current?.focus();
      }, [input, loading, userId, sessionId]);

      const handleKeyDown = (e) => {
        if (e.key === "Enter" && !e.shiftKey) {
          e.preventDefault();
          sendMessage();
        }
      };

      const handleNewChat = () => {
        setMessages([]);
        setSessionId(null);
      };

      const handleInputChange = (e) => {
        setInput(e.target.value);
        e.target.style.height = "auto";
        e.target.style.height = Math.min(e.target.scrollHeight, 120) + "px";
      };

      const timeStr = (d) => d.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });

      return (
        <div className="app">
          {showOnboarding && (
            <OnboardingModal onComplete={handleOnboardingComplete} onSkip={handleOnboardingSkip} />
          )}

          {/* Sidebar backdrop (mobile) */}
          {sidebarOpen && (
            <div className="sidebar-backdrop" onClick={() => setSidebarOpen(false)} />
          )}

          {/* Sidebar */}
          <aside className={`sidebar ${sidebarOpen ? "" : "collapsed"}`}>
            <div className="sidebar-header">
              <div className="sidebar-logo">ownly</div>
              <div className="sidebar-tagline">building a future</div>
              <button className="sidebar-close" onClick={() => setSidebarOpen(false)}>
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round">
                  <line x1="18" y1="6" x2="6" y2="18" /><line x1="6" y1="6" x2="18" y2="18" />
                </svg>
              </button>
            </div>

            <button className="new-chat-sidebar" onClick={handleNewChat}>
              New Conversation
            </button>

            {estimate && (
              <div style={{ padding: "0 20px 12px", fontSize: 12, color: "var(--teal)" }}>
                Est. max price: ${Number(estimate.estimated_max_price).toLocaleString()}
              </div>
            )}

            <div className="sidebar-section-title">Knowledge Topics</div>
            <div className="topic-list">
              {topics.map((t) => (
                <div
                  key={t.id}
                  className="topic-item"
                  onClick={() => sendMessage(`Tell me about: ${t.title}`)}
                >
                  <div className="topic-dot" style={{ background: CAT_COLORS[t.category] || "#4f9cf7" }} />
                  {t.title}
                </div>
              ))}
            </div>

            <div className="progress-bar-wrap">
              <div className="progress-label">
                <span>Progress</span>
                <span>{progress.topics_covered}/{progress.topics_total}</span>
              </div>
              <div className="progress-track">
                <div className="progress-fill" style={{ width: `${progress.completion_pct}%` }} />
              </div>
            </div>
          </aside>

          {/* Main */}
          <main className="main">
            <div className="topbar">
              <button className="menu-btn" onClick={() => setSidebarOpen(!sidebarOpen)}>
                <MenuIcon />
              </button>
              <div className="topbar-title">Mortgage Educator</div>
              <div className="topbar-status"><div className="status-dot" /> Online</div>
            </div>

            <div className="messages-wrap">
              <div className="messages-inner">
                {messages.length === 0 ? (
                  <div className="welcome">
                    <h1>Welcome to <span>ownly</span></h1>
                    <p>
                      Your AI-powered home buyer advisor for the Canadian market.
                      Ask about rates, down payments, the stress test, pre-construction risks, and more.
                    </p>
                    <div className="quick-grid">
                      {QUICK_QUESTIONS.map((q, i) => (
                        <button key={i} className="quick-btn" onClick={() => sendMessage(q)}>{q}</button>
                      ))}
                    </div>
                  </div>
                ) : (
                  messages.map((msg, i) => (
                    <div key={i} className={`msg-row ${msg.role === "user" ? "user" : ""}`}>
                      <div className={`msg-avatar ${msg.role === "user" ? "user" : "ai"}`}>
                        {msg.role === "user" ? "You" : "N"}
                      </div>
                      <div className="msg-body">
                        <div
                          className={`msg-bubble ${msg.role === "user" ? "user" : "ai"}`}
                          dangerouslySetInnerHTML={{
                            __html: msg.role === "user" ? formatText(msg.content) : formatText(msg.content),
                          }}
                        />
                        {msg.topics && msg.topics.length > 0 && (
                          <div className="msg-topics">
                            {msg.topics.map((t) => (
                              <span key={t.id} className="msg-topic-tag">{t.title}</span>
                            ))}
                          </div>
                        )}
                        <div className="msg-time">{timeStr(msg.time)}</div>
                      </div>
                    </div>
                  ))
                )}

                {loading && (
                  <div className="typing">
                    <div className="msg-avatar ai">N</div>
                    <div className="typing-dots">
                      <div className="typing-dot" />
                      <div className="typing-dot" />
                      <div className="typing-dot" />
                    </div>
                  </div>
                )}
                <div ref={endRef} />
              </div>
            </div>

            <div className="input-area">
              <div className="input-wrap">
                <textarea
                  ref={inputRef}
                  className="input-field"
                  rows={1}
                  value={input}
                  onChange={handleInputChange}
                  onKeyDown={handleKeyDown}
                  placeholder="Ask about Canadian mortgages..."
                  disabled={loading}
                />
                <button className="send-btn" onClick={() => sendMessage()} disabled={!input.trim() || loading}>
                  <SendIcon />
                </button>
              </div>
              <div className="input-hint">
                Educational information only -- not financial advice. Press Enter to send.
              </div>
            </div>
          </main>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
